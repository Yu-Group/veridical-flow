[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "vflow"
version = "1.0.0"
authors = [
  { name="Chandan Singh", email="chandan_singh@berkeley.edu" },
  { name="James Duncan", email="jpduncan@berkeley.edu" },
  { name="Abhineet Agarwal", email="aa3797@berkeley.edu" },
  { name="Rush Kapoor", email="rush.kapoor@berkeley.edu " },
]
maintainers = [
  { name="James Duncan", email="jpduncan@berkeley.edu" },
]
description = "A framework for doing stability analysis with PCS."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Intended Audience :: Science/Research",
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Operating System :: OS Independent",
]
license = {text = "MIT"}
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://vflow.csinva.io/"
Issues = "https://github.com/Yu-Group/veridical-flow/issues"

[project.optional-dependencies]
nb = [
  "tqdm",
  "jupyter",
  "jupyterlab",
  "scikit-learn>=0.23.0",
  "torch>=1.0.0",
  "torchvision",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.build.targets.sdist]
# the package, its tests and what the build needs; the docs site and the
# notebooks (with their example data) live in the repo, not the sdist
include = [
  "/vflow",
  "/tests",
  "/agents",
  "/requirements.txt",
  "/README.md",
  "/license.md",
  "/citation.cff",
]

[tool.hatch.build.targets.wheel]
packages = ["vflow"]

[tool.coverage.run]
branch = true
source_pkgs = ["vflow", "tests"]
